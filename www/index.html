    <symbol id="i-opq" viewBox="0 0 24 24"><rect x="3.4" y="4.2" width="17.2" height="15.6" rx="3.6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16.4" cy="8.6" r="1.7" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3.4a8.6 8.6 0 100 17.2c1.7 0 2.2-1.1 1.6-2.2-.6-1.2.2-2.6 1.6-2.6h1.6a3.6 3.6 0 003.6-3.6C20.4 6.7 16.7 3.4 12 3.4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><circle cx="8" cy="11" r="1.3" fill="currentColor"/><circle cx="11.2" cy="7.6" r="1.3" fill="currentColor"/><circle cx="15.6" cy="8.6" r="1.3" fill="currentColor"/><circle cx="7.9" cy="15" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-extract" viewBox="0 0 24 24" fill="none"><path d="M6 12V13C6 16.31 8.69 19 12 19C15.31 19 18 16.31 18 13V8C18 4.69 15.31 2 12 2C8.69 2 6 4.69 6 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11V13C3 17.97 7.03 22 12 22C16.97 22 21 17.97 21 13V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.10999 7.47993C10.89 6.82993 12.83 6.82993 14.61 7.47993" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.03 10.4799C11.23 10.1499 12.5 10.1499 13.7 10.4799" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>

<div id="app">

  <!-- ============ HOME ============ -->
  <section class="screen" id="home">
    <header class="home-top">
      <h1 class="logo"><span>Apex</span> Cut</h1>
      <button class="gbtn" id="btnSettings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    </header>
    <div class="home-actions">
      <button class="bbtn gnew" id="btnNew" aria-label="New project"><svg><use href="#i-star"/></svg><b>New Project</b></button>
      <button class="gbtn gtpl" id="btnFiles" aria-label="Templates"><svg><use href="#i-folder"/></svg><b>Templates</b></button>
    </div>
    <div class="rec-head"><h2>Recent Projects</h2><button class="rec-all" id="btnAll" type="button">See all<svg><use href="#i-chevr"/></svg></button></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- ============ EDITOR ============ -->
  <section class="screen off-r" id="editor">
    <header class="ed-top">
      <button class="gbtn" id="edBack" aria-label="Back"><svg><use href="#i-back"/></svg></button>
      <h2 id="edTitle">Project</h2>
      <div class="txbar" id="txBar" aria-hidden="true">
        <button class="gbtn tb-al" id="txAl" aria-label="Text align"><svg><use href="#i-tal-c"/></svg></button>
        <div class="tb-mid" id="txMid"><button class="gbtn tb-font" id="txFont" type="button"><b id="txFontV">Font</b><i class="chev"><svg><use href="#i-chev"/></svg></i></button><div class="gbtn tb-sl" id="txSl"><i class="tsl-tr"></i><i class="tsl-fill"></i><b class="tsl-th"></b></div></div>
        <button class="gbtn tb-sz" id="txSz" type="button"><b id="txSzV">18pt</b></button>
      </div>
      <div class="msbar" id="msBar" aria-hidden="true">
        <button class="gbtn ms-x" id="msX" aria-label="Clear selection"><svg><use href="#i-x"/></svg></button>
        <div class="ms-count" id="msN">1 layer selected</div>
        <button class="gbtn ms-b" id="msG" aria-label="Group"><svg><use href="#i-group"/></svg></button>
        <button class="gbtn ms-b" id="msM" aria-label="Mask Group"><svg><use href="#i-mask"/></svg></button>
        <button class="gbtn ms-b" id="msI" aria-label="Invert Mask Group"><svg><use href="#i-maskinv"/></svg></button>
        <button class="gbtn ms-b" id="msD" aria-label="Delete layers"><svg><use href="#i-trash"/></svg></button>
      </div>
      <div class="ed-right">
        <button class="gbtn" id="ed3d" type="button" aria-label="3D layer" aria-pressed="false"><svg><use href="#i-3d"/></svg></button>
        <button class="gbtn" id="edSettings" aria-label="Project settings"><svg class="i-a"><use href="#i-gear"/></svg><svg class="i-b"><use href="#i-x"/></svg><svg class="i-c"><use href="#i-parent"/></svg></button>
        <button class="bbtn" id="edExport" aria-label="Export"><svg class="i-a"><use href="#i-export"/></svg><svg class="i-b"><use href="#i-check"/></svg><svg class="i-c"><use href="#i-dots3"/></svg></button>
      </div>
    </header>

    <div class="stage" id="stage"><div class="canvas" id="canvas"><div class="appicon"><svg><use href="#i-star"/></svg></div><div class="txprev" id="txPrev"></div></div></div>

    <div class="ctrl">
      <div class="grp">
        <button class="ib" id="btnUndo"><svg><use href="#i-undo"/></svg></button>
        <button class="ib" id="btnRedo"><svg><use href="#i-redo"/></svg></button>
        <span class="sep"></span>
        <button class="ib" id="btnMark"><svg><use href="#i-mark"/></svg></button>
      </div>
      <div class="grp mid">
        <button class="nbtn" id="btnPrev"><svg><use href="#i-prev"/></svg></button>
        <button class="bbtn play" id="btnPlay"><svg id="playIco"><use href="#i-play"/></svg></button>
        <button class="nbtn" id="btnNext"><svg><use href="#i-next"/></svg></button>
      </div>
      <div class="grp">
        <button class="ib" id="btnSnap"><svg><use href="#i-magnet"/></svg></button>
        <span class="sep"></span>
        <button class="ib" id="btnGraph" aria-label="Graph editor"><svg><use href="#i-fit"/></svg></button>
        <button class="ib" id="btnList"><svg><use href="#i-list"/></svg></button>
      </div>
    </div>

    <div class="tl" id="tl">
      <div class="ruler"><div class="rin" id="rin"></div></div>
      <div class="lanes" id="lanes"><div class="sec" id="secV"></div><div class="divider" id="divider" aria-label="Drag up to hide video, down to hide audio"><span class="handle"></span><em id="dvHint"></em></div><div class="sec" id="secA"></div></div>
      <div class="mkl" id="mkl"></div>
      <div class="head" id="head"><span class="bubble" id="bubble">0:00</span></div>
    </div>

    <div class="glass mp" id="mp" aria-hidden="true">
      <div class="mp-grip" id="mpG" aria-label="Drag to resize"><i></i></div>
      <div class="mp-h">
        <div class="mp-tabs" id="mpTabs"><button type="button" data-t="a" class="on">Attributes</button><button type="button" data-t="n">Anchor &amp; Align</button></div>
        <b class="mp-title" id="mpTitle"></b>
        <button class="pp-k" id="mpR" aria-label="Reset"><svg viewBox="0 0 24 24"><path d="M4.500 12a7.500 7.500 0 107.500-7.500H8M10.500 1.800L7.700 4.500l2.800 2.700" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="pp-k" id="mpX" aria-label="Close"><svg><use href="#i-x"/></svg></button>
      </div>
      <div class="mp-body" id="mpB"></div>
    </div>

    <div class="glass mp sp" id="sp" aria-hidden="true">
      <div class="mp-h"><b class="mp-title" style="display:block">Shapes</b><button class="pp-k" id="spX" aria-label="Close"><svg><use href="#i-x"/></svg></button></div>
      <div class="sp-grid" id="spG"></div>
    </div>

    <footer class="tools" id="tools">
      <div class="gpill" id="toolPill" aria-hidden="true">
        <button class="on" data-tool="edit"><svg><use href="#i-pen"/></svg></button>
        <button data-tool="cut"><svg><use href="#i-cut"/></svg></button>
        <button data-tool="layout"><svg><use href="#i-layout"/></svg></button>
        <button data-tool="style"><svg><use href="#i-brush"/></svg></button>
        <button data-tool="adjust"><svg><use href="#i-adjust"/></svg></button>
      </div>
      <button class="bbtn fab" id="btnAdd"><svg class="f-star"><use href="#i-star"/></svg><svg class="f-tf"><use href="#i-movetf"/></svg></button>
    </footer>
  </section>

  <!-- ============ NEW PROJECT (glass panel) ============ -->
  <div class="scrim" id="scrim">
    <div class="glass panel" id="panel">
      <fieldset class="field"><legend>Project Name</legend><input id="pname" type="text" maxlength="24" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Project Name"></fieldset>
      <div class="ratios" id="ratios"></div>
      <div class="prow"><span>Resolution</span>
        <button class="dd" id="selRes" type="button"><b id="resV">1080p</b><i class="chev"><svg><use href="#i-chev"/></svg></i></button>
        </div>
      <div class="prow"><span>Frame Rate</span>
        <button class="dd" id="selFps" type="button"><b id="fpsV">90fps</b><i class="chev"><svg><use href="#i-chev"/></svg></i></button>
        </div>
      <div class="pfoot">
        <button class="tile-btn" id="pCancel" aria-label="Close"><svg><use href="#i-trash"/></svg></button>
        <button class="create" id="pCreate" type="button">Create Project</button>
      </div>
    </div>
  </div>

  <!-- ============ APP SETTINGS (glass panel, blurred backdrop) ============ -->
  <div class="scrim setscrim" id="setScrim">
    <div class="glass panel setpanel" id="setPanel">
      <div class="set-h"><b>Settings</b><button class="pp-k" id="setX" type="button" aria-label="Close"><svg><use href="#i-x"/></svg></button></div>
      <div class="set-tg"><span>Auto Arrange text layers</span><button type="button" class="ps-sw2" id="setAr" aria-label="Auto Arrange text layers"></button></div>
      <div class="set-tg"><span>Property labels</span><button type="button" class="ps-sw2" id="setLb" aria-label="Property labels"></button></div>
      <div class="set-ic"><span>App icon</span><div class="set-icg" id="setIcons">
        <button type="button" class="set-icb" data-ic="default" aria-label="Default icon"><img src="img/icon-default.png" alt=""><em>Classic</em></button>
        <button type="button" class="set-icb" data-ic="prism" aria-label="Prism icon"><img src="img/icon-prism.png" alt=""><em>Prism</em></button>
      </div></div>
    </div>
  </div>

  <div class="gmenu" id="menuRes"></div><div class="gmenu" id="menuFps"></div>
  <!-- glass text dialog (rename / custom ratio) -->
  <div class="scrim dlg" id="dlg"><div class="glass card-dlg">
    <h3 id="dlgT"></h3>
    <fieldset class="field sm"><input id="dlgIn" type="text" maxlength="24" autocomplete="off" spellcheck="false"></fieldset>
    <div class="pfoot"><button class="create" id="dlgNo" type="button">Cancel</button><button class="create ready" id="dlgOk" type="button">OK</button></div>
  </div></div>

  <!-- card menu + toast -->
  <div class="gmenu card-menu" id="cardMenu"></div>
  <div class="toast" id="toast"></div>
</div>

<script src="js/editor.js"></script>
<script src="js/graph-editor.js"></script>
<script src="js/panelwin.js"></script>
<script src="js/extras.js"></script>
<script src="js/shapeedit.js"></script>
<script src="js/fx.js"></script>
<script src="js/media.js"></script>
<script src="js/turbo.js"></script>
<script src="js/fxpanel.js"></script>
<script src="js/textedit.js"></script>
<script src="js/animator.js"></script>
<script src="js/features.js"></script>
<script src="js/d3panel.js"></script>
<script src="js/settings.js"></script>
<script src="js/penbg.js"></script>
<script src="js/layermenu.js"></script>
</body>
</html>
